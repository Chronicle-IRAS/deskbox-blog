name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
      PUBLIC_UMAMI_SRC: ${{ vars.PUBLIC_UMAMI_SRC }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check
      - run: npm run test

      # OG images embed Chinese text via sharp/librsvg; install CJK fonts.
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm run build
      - run: npm run check:csp

      - name: Check committed CSP hashes
        if: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID == '' }}
        run: git diff --exit-code -- deploy/csp-hashes.json deploy/csp-policy.txt

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - run: npm run measure

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
