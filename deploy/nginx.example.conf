# Nginx snippet for a self-hosted static deployment.
# Rendered to dist/nginx.conf by `npm run build`.
# Copy dist/nginx-security-headers.conf to the snippet path below.
# Nginx inherits add_header only when the child level defines none, so every
# location that sets Cache-Control must also include the security snippet.
#
# Include the standard mime.types at http scope. Ensure it maps webp/avif:
#   image/webp webp;
#   image/avif avif;
# Pagefind's wasm data file (`wasm.unknown.pagefind`) is fetched as bytes and
# decompressed by Pagefind; no application/wasm mapping is required.

include /etc/nginx/snippets/deskbox-security-headers.conf;

root /var/www/deskbox-blog;
index index.html;

error_page 404 /404.html;

location / {
  include /etc/nginx/snippets/deskbox-security-headers.conf;
  try_files $uri $uri/ =404;
  add_header Cache-Control "public, max-age=0, must-revalidate" always;
}

location = /404.html {
  internal;
  include /etc/nginx/snippets/deskbox-security-headers.conf;
  add_header Cache-Control "public, max-age=0, must-revalidate" always;
}

location /_astro/ {
  include /etc/nginx/snippets/deskbox-security-headers.conf;
  try_files $uri =404;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location /pagefind/ {
  include /etc/nginx/snippets/deskbox-security-headers.conf;
  try_files $uri =404;
  add_header Cache-Control "public, max-age=3600" always;
}

location = /rss.xml {
  include /etc/nginx/snippets/deskbox-security-headers.conf;
  add_header Cache-Control "public, max-age=3600" always;
}

location = /robots.txt {
  include /etc/nginx/snippets/deskbox-security-headers.conf;
  add_header Cache-Control "public, max-age=3600" always;
}

location ~ ^/sitemap.*\.xml$ {
  include /etc/nginx/snippets/deskbox-security-headers.conf;
  add_header Cache-Control "public, max-age=3600" always;
}

location = /favicon.svg {
  include /etc/nginx/snippets/deskbox-security-headers.conf;
  add_header Cache-Control "public, max-age=86400" always;
}

# Enable after HTTPS and a stable domain:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
