# Nginx snippet for a self-hosted static deployment.
# Replace {{CSP_HASHES}} with the space-separated hashes from deploy/csp-hashes.json.
# Note: add_header in a location block replaces inherited server-level headers.

types {
  application/wasm wasm;
  image/webp webp;
  image/avif avif;
}

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' {{CSP_HASHES}}; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

root /var/www/deskbox-blog;
index index.html;

location / {
  try_files $uri $uri/ =404;
  add_header Cache-Control "public, max-age=0, must-revalidate" always;
}

location /_astro/ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
}

location /pagefind/ {
  add_header Cache-Control "public, max-age=3600" always;
  try_files $uri =404;
}

location = /rss.xml {
  add_header Cache-Control "public, max-age=3600" always;
}

location = /robots.txt {
  add_header Cache-Control "public, max-age=3600" always;
}

location ~ ^/sitemap.*\.xml$ {
  add_header Cache-Control "public, max-age=3600" always;
}

# Enable after HTTPS and a stable domain:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
