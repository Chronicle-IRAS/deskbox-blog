# GitHub Actions template. Rename to .github/workflows/ci.yml after a remote is configured.

name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build
      - run: npm run check:csp

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - run: npm run measure

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
