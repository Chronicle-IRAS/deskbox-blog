  <line x1="48" y1="498" x2="1152" y2="498" stroke="#E4E4E7" stroke-width="2"/>
  <line x1="820" y1="132" x2="820" y2="498" stroke="#E4E4E7" stroke-width="2"/>

  <!-- Header Row -->
  <rect x="84" y="78" width="10" height="24" fill="#BE185D"/>
  <text x="108" y="97" fill="#09090B" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="600" letter-spacing="2">DESKBOX · SWISS EDITORIAL</text>
  <text x="1116" y="97" text-anchor="end" fill="#52525B" font-family="'JetBrains Mono', Consolas, monospace" font-size="18" letter-spacing="1">ZH-CN / STATIC</text>

