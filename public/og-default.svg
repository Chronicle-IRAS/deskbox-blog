  <text x="84" y="268" fill="#09090B" font-family="Georgia, 'Libre Bodoni', 'Songti SC', 'STSong', 'SimSun', serif" font-size="88" font-weight="700" letter-spacing="-2">DeskBox</text>
  <text x="84" y="356" fill="#09090B" font-family="'Songti SC', 'STSong', 'SimSun', Georgia, serif" font-size="48" font-weight="600">写代码，也写生活。</text>
  <text x="84" y="424" fill="#52525B" font-family="'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="26">以内容与排版为中心的个人技术与阅读归档。</text>

